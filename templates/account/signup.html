{% extends 'account/base_auth.html' %}
{% block auth_content %}
  <form class="login100-form validate-form" method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    {% include 'account/_errors.html' %}
    <span class="login100-form-title">
        ثبت نام
    </span>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="text" name="username" placeholder="نام کاربری"  required>
      <span class="focus-input100"></span>
      <span class="symbol-input100">
        <i class="fa fa-user" aria-hidden="true"></i>
      </span>
    </div>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="email" name="email" placeholder="ایمیل" required>
      <span class="focus-input100"></span>
      <span class="symbol-input100">
        <i class="fa fa-envelope" aria-hidden="true"></i>
      </span>
    </div>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="password" name="password1" placeholder="رمز عبور" required>
      <span class="focus-input100"></span>
      <span class="symbol-input100">
        <i class="fa fa-lock" aria-hidden="true"></i>
      </span>
    </div>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="password" name="password2" placeholder="تکرار رمز عبور" required>
      <span class="focus-input100"></span>
      <span class="symbol-input100">
        <i class="fa fa-lock" aria-hidden="true"></i>
      </span>
    </div>
    
    <div class="container-login100-form-btn">
      <button type="submit" class="login100-form-btn">
        ثبت نام
      </button>
    </div>

    <div class="text-center p-t-136">
      <a class="txt2" href="{% url 'account_login' %}">
        وارد شدن به حساب
        <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
      </a>
    </div>
  </form>
{% endblock %}
