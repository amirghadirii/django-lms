{% extends 'account/base_auth.html' %}
{% block auth_content %}
  <form class="login100-form validate-form" method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    
	{% include 'account/_errors.html' %}
    
	<span class="login100-form-title">ورود به حساب کاربری</span>
    
	<div class="wrap-input100 validate-input" data-validate="نام کاربری یا ایمیل الزامی است">
      <input class="input100" type="text" name="login" placeholder="نام کاربری یا ایمیل" required />
      <span class="focus-input100"></span>
      <span class="symbol-input100"><i class="fa fa-user" aria-hidden="true"></i></span>
    </div>
    
	<div class="wrap-input100 validate-input" data-validate="رمز عبور الزامی است">
      <input class="input100" type="password" name="password" placeholder="رمز عبور" required />

      <span class="focus-input100"></span>
      <span class="symbol-input100"><i class="fa fa-lock" aria-hidden="true"></i></span>
    </div>

    <div class="container-login100-form-btn">
      <button type="submit" class="login100-form-btn">ورود</button>
    </div>

    <div class="text-center p-t-12">
      <a class="txt2" href="{% url 'account_reset_password' %}">رمز عبور را فراموش کرده‌اید؟</a>
    </div>

    <div class="text-center p-t-136">
      <a class="txt2" href="{% url 'account_signup' %}">
        ساخت حساب کاربری جدید
        <i class="fa fa-long-arrow-left m-l-5" aria-hidden="true"></i>
      </a>
    </div>
  </form>
{% endblock %}
