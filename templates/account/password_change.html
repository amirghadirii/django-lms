{% extends 'account/base_auth.html' %}
{% load static %}

{% block auth_content %}
  <form class="login100-form validate-form" method="post" action="{% url 'account_change_password' %}">
    {% csrf_token %}
    {% include 'account/_errors.html' %}
    <span class="login100-form-title">تغییر رمز عبور</span>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="password" name="oldpassword" placeholder="رمز عبور فعلی" required>
      <span class="focus-input100"></span>
      <span class="symbol-input100"><i class="fa fa-lock"></i></span>
    </div>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="password" name="password1" placeholder="رمز عبور جدید" required>
      <span class="focus-input100"></span>
      <span class="symbol-input100"><i class="fa fa-key"></i></span>
    </div>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="password" name="password2" placeholder="تکرار رمز عبور جدید" required>
      <span class="focus-input100"></span>
      <span class="symbol-input100"><i class="fa fa-key"></i></span>
    </div>

    <div class="container-login100-form-btn">
      <button type="submit" class="login100-form-btn">تغییر رمز</button>
    </div>

    <div class="text-center p-t-50">
      <a class="txt2" href="{% url 'account_logout' %}">
        بازگشت به پروفایل
        <i class="fa fa-long-arrow-left m-l-5"></i>
      </a>
    </div>
  </form>
{% endblock %}
