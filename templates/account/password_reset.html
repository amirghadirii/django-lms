{% extends 'account/base_auth.html' %}
{% block auth_content %}
  <form class="login100-form validate-form" method="post" action="{% url 'account_reset_password' %}">
    {% csrf_token %}
    {% include 'account/_errors.html' %}
    <span class="login100-form-title">بازیابی رمز عبور</span>
    
    <p class="text-center p-b-20">ایمیل خود را وارد کنید تا لینک تغییر رمز ارسال شود.</p>

    <div class="wrap-input100 validate-input">
      <input class="input100" type="email" name="email" placeholder="ایمیل شما" required>
      <span class="symbol-input100"><i class="fa fa-envelope"></i></span>
    </div>

    <div class="container-login100-form-btn">
      <button type="submit" class="login100-form-btn">ارسال ایمیل</button>
    </div>

    <div class="text-center p-t-136">
      <a class="txt2" href="{% url 'account_login' %}">بازگشت به صفحه ورود</a>
    </div>
  </form>
{% endblock %}
