{% load static %}
{% for post in posts %}
  <div class="col-lg-4 col-sm-4 col-xs-12 wow fadeInUp" data-wow-duration="1s" data-wow-delay="0.1s" data-wow-offset="0">
    <div class="single_blog">
      <img src="{{ post.image.url }}" class="img-fluid" alt="{{ post.title }}" />
      <div class="content_box">
        <span>{{ post.published_date|date:"d M Y" }} | <a href="#" title="مطالب {{ post.category }}">{{ post.category }}</a></span>
        <h2><a href="{% url 'blog:single' pid=post.id %}" title="{{ post.title }}">{{ post.title }}</a></h2>
        <a class="btn_one" href="{% url 'blog:single' pid=post.id %}" title="مطالعه مقاله">ادامه مطلب<i class="ti-arrow-top-left"></i></a>
      </div>
    </div>
  </div>
{% endfor %}
